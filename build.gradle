// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        maven {
            url "https://maven.aliyun.com/repository/public"
        }
        maven {
            setUrl("https://jitpack.io")
            content {
                includeGroup("com.github.aasitnikov")
            }
        }
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.kotlin.gradle.plugin
        classpath libs.fat.aar.android
    }

}

plugins {
alias(libs.plugins.androidApplication) apply false
}

project.ext {
    android = [
            compileSdk       : 34,
            buildToolsVersion: "34.0.2",
            applicationId    : "com.tongyi.multimodal_conversation",
            minSdk           : 27,
            targetSdk        : 28,
            versionCode      : 2,
            versionName      : "1.0.0",
            applicationName  : "MultimodalDialog",
    ]

    dependencies = [
            /*
            "constraint-layout"          : "com.android.support.constraint:constraint-layout:${constraintVersion}",

            //leakcanary
            "leakcanary-android"         : "com.squareup.leakcanary:leakcanary-android:${leakcanaryVersion}",
            "leakcanary-android-no-op"   : "com.squareup.leakcanary:leakcanary-android-no-op:${leakcanaryVersion}",
            "leakcanary-android-fragment": "com.squareup.leakcanary:leakcanary-support-fragment:${leakcanaryVersion}",
             */

    ]
}